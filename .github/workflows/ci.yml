# Build + teste + lint pe fiecare PR. Fără artefacte (doar la rulare manuală, păstrate 3 zile).
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: ktlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ktlint.jar" \
            https://repo1.maven.org/maven2/com/pinterest/ktlint/ktlint-cli/1.8.0/ktlint-cli-1.8.0-all.jar
          java -jar "$RUNNER_TEMP/ktlint.jar" "**/*.kt" "**/*.kts"

      - name: Build, teste, lint
        run: ./gradlew --no-daemon --stacktrace :core:parser:test testDebugUnitTest lintDebug assembleDebug

      # Release nesemnat (R8/minify + varianta de profilare), ca să nu aflăm de erori abia la Release.
      # Un singur ABI: R8 e la fel pentru toate, iar build-ul rămâne scurt.
      - name: Build release (nesemnat, arm64)
        run: >
          ./gradlew --no-daemon --stacktrace -Pakvod.releaseAbi=arm64-v8a
          :app:assembleRelease :app:compileNonMinifiedReleaseKotlin

      - name: APK de test (doar la rulare manuală)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ak-vod-hub-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3

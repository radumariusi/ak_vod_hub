# APK semnat → GitHub Releases, doar la cerere (Actions → Release → Run workflow), nu la fiecare merge.
# Se păstrează permanent v0.1.14 și cea mai nouă altă versiune.
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AK_SIGNING_KEY: ${{ secrets.AK_SIGNING_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verifică cheia de semnare
        id: key
        run: |
          if [ -z "$AK_SIGNING_KEY" ]; then
            echo "::warning::Lipsește secretul AK_SIGNING_KEY, deci nu public release. Vezi docs/RELEASES.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.ok == 'true'
        with:
          fetch-depth: 0

      - name: Versiune
        if: steps.key.outputs.ok == 'true'
        id: version
        run: |
          code=$(git rev-list --count HEAD)
          base=$(grep '^akvod.versionBase=' gradle.properties | cut -d= -f2)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$base.$code" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$base.$code" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6
        if: steps.key.outputs.ok == 'true' && steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Construiește și verifică APK-urile semnate
        if: steps.key.outputs.ok == 'true' && steps.version.outputs.exists == 'false'
        env:
          RELEASE_CODE: ${{ steps.version.outputs.code }}
          RELEASE_NAME: ${{ steps.version.outputs.name }}
        run: bash scripts/build-release-apks.sh

      - name: Publică release-ul
        if: steps.key.outputs.ok == 'true' && steps.version.outputs.exists == 'false'
        run: |
          name="${{ steps.version.outputs.name }}"
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$prev" ]; then
            git log "$prev..HEAD" --no-merges --pretty='- %s' > "$RUNNER_TEMP/notes.md"
          else
            git log -1 --pretty='- %s' > "$RUNNER_TEMP/notes.md"
          fi
          gh release create "v$name" "$RUNNER_TEMP/ak-vod-hub-$name.apk" "$RUNNER_TEMP/ak-vod-hub-$name-"*.apk.bin \
            --target "$GITHUB_SHA" --title "AK VOD Hub $name" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Păstrează baza v0.1.14 și cea mai nouă versiune
        if: steps.key.outputs.ok == 'true'
        run: |
          set -euo pipefail
          gh release view v0.1.14 --json tagName >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.14" >/dev/null
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName != "v0.1.14" and .tagName != "claude-handoff-2026-11-17")) | sort_by(.createdAt) | reverse | .[1:] | .[].tagName' |
          while read -r tag; do
            case "$tag" in
              v0.1.14|claude-handoff-2026-11-17) echo "::error::Tag protejat: $tag"; exit 1 ;;
            esac
            echo "delete release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

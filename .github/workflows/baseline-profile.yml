name: Baseline Profile

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'jules/14-performance'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Activează KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generează și verifică profilul pe Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/verify-baseline-profile.sh
      - uses: actions/upload-artifact@v7
        with:
          name: baseline-profile-android-11
          path: app/src/main/generated/baselineProfiles/*.txt
          if-no-files-found: error
          retention-days: 3

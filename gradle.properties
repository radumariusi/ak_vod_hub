org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Versiunea aplicației: CI adaugă numărul build-ului (ex. 0.1.42).
akvod.versionBase=0.1
# Repo-ul din care aplicația ia update-urile (GitHub Releases).
akvod.updateRepo=radumariusi/ak_vod_hub
